baseURL = 'https://david-williston.github.io/medtrica/'
locale = 'en-US'
title = 'Medtrica'
theme = 'PaperMod'
enableRobotsTXT = true
[params]
  description = 'Medical mattresses, positioning products and OEM manufacturing for healthcare facilities.'
  defaultTheme = 'light'
  disableThemeToggle = true
  ShowBreadCrumbs = true
  hideMeta = true
  mainSections = ['products']
[params.label]
  text = 'Medtrica'
  icon = 'images/logo.png'
  iconHeight = 40
[outputs]
  home = ['HTML', 'RSS', 'JSON']
[[menus.main]]
  name = 'Products'
  url = '/products/'
  weight = 10
[[menus.main]]
  name = 'Our company'
  url = '/about/'
  weight = 20
[[menus.main]]
  name = 'OEM & private label'
  url = '/oem-private-label/'
  weight = 30
[[menus.main]]
  name = 'Search'
  url = '/search/'
  weight = 40
[[menus.main]]
  name = 'Contact us'
  url = '/contact-us/'
  weight = 50

[markup.goldmark.renderer]
  unsafe = true
[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 35

[[module.mounts]]
  source = 'assets'
  target = 'assets'
[[module.mounts]]
  source = 'static/media'
  target = 'assets/media'

[params.assets]
  favicon = 'favicon.svg'
  favicon16x16 = 'favicon.svg'
  favicon32x32 = 'favicon.svg'
  apple_touch_icon = 'images/logo.png'
  safari_pinned_tab = 'favicon.svg'
